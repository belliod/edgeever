#glow-purple)"/><rect width="104" height="26" x="52" y="52" fill="#0369a1" fill-opacity=".25" stroke="#38bdf8" stroke-opacity=".4" stroke-width="1" rx="13"/><circle cx="65" cy="65" r="3.5" fill="#38bdf8"/><text x="76" y="69" class="tag">INSIGHT</text><g transform="translate(420, 80)"><rect width="70" height="70" x="-35" y="-35" fill="none" stroke="url(#icon-grad)" stroke-opacity=".4" stroke-width="2" rx="18" transform="rotate(25)"/><rect width="60" height="60" x="-30" y="-30" fill="url(#icon-grad)" rx="16"/><path fill="#fff" d="M0 -15 L4.5 -4.5 L15 0 L4.5 4.5 L0 15 L-4.5 4.5 L-15 0 L-4.5 -4.5 Z"/><circle cx="36" cy="-28" r="3" fill="#38bdf8"/><circle cx="-32" cy="38" r="2" fill="#c084fc"/></g><text x="52" y="126" class="title">捕捉灵感与思考的火花</text><text x="52" y="160" class="subtitle">这是一段用于笔记渲染验证的矢量 SVG 示例卡片。</text><text x="52" y="184" class="subtitle">具备自适应渐变、平滑圆角投影与现代毛玻璃视觉效果。</text><line x1="52" x2="548" y1="228" y2="228" stroke="url(#line-grad)" stroke-width="1.5"/><g><g transform="translate(52, 260) translate(0, 0)"><circle cx="6" cy="6" r="4" fill="#22c55e"/><text x="20" y="10" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="13" font-weight="500">矢量保真</text><text x="20" y="28" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">无限放大不失真</text></g><g transform="translate(52, 260) translate(180, 0)"><circle cx="6" cy="6" r="4" fill="#38bdf8"/><text x="20" y="10" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="13" font-weight="500">深色适配</text><text x="20" y="28" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Dark Mode 友好</text></g><g transform="translate(52, 260) translate(360, 0)"><circle cx="6" cy="6" r="4" fill="#a855f7"/><text x="20" y="10" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="13" font-weight="500">轻量高效</text><text x="20" y="28" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">&lt; 3KB 代码尺寸</text></g></g></svg>